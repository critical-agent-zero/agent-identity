name: deploy

on:
  workflow_dispatch:
  push:
    branches: [main]

concurrency:
  group: deploy
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0
        with:
          version: 9
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 20
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm vitest run
      - run: npx tsc --noEmit -p tsconfig.base.json
      - name: CDK synth (no credentials)
        working-directory: infra
        run: pnpm exec cdk synth -c domain=ci.invalid > /dev/null

  deploy:
    needs: test
    runs-on: ubuntu-latest
    environment: production
    permissions:
      id-token: write
      contents: read
    steps:
      # MAIL_DOMAIN must be a secret, not a variable: the runner prints every
      # step's env block in its log header BEFORE the script runs, so an
      # ::add-mask:: emitted by the script is too late for that header, and
      # vars.* are never auto-masked. Secrets register with the masker at job
      # setup, before any header is written.
      - name: Check required configuration
        env:
          MAIL_DOMAIN: ${{ secrets.MAIL_DOMAIN }}
          BUDGET_EMAIL: ${{ secrets.BUDGET_EMAIL }}
          AWS_REGION: ${{ vars.AWS_REGION }}
          AWS_DEPLOY_ROLE_ARN: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
        run: |
          missing=0
          if [ -z "$MAIL_DOMAIN" ]; then
            echo "::error::Secret MAIL_DOMAIN is not set. Add it under Settings > Secrets and variables > Actions > Secrets (repo or production environment) — it must be a secret so logs mask it."
            missing=1
          fi
          for v in AWS_REGION AWS_DEPLOY_ROLE_ARN; do
            if [ -z "$(eval echo "\$$v")" ]; then
              echo "::error::Repository variable $v is not set. Add it under Settings > Secrets and variables > Actions > Variables."
              missing=1
            fi
          done
          exit $missing
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0
        with:
          version: 9
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 20
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - uses: aws-actions/configure-aws-credentials@7474bc4690e29a8392af63c5b98e7449536d5c3a # v4.3.1
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}
      - name: CDK deploy
        working-directory: infra
        env:
          # infra/bin/app.ts falls back to MAIL_DOMAIN; secret (masked at job
          # setup) passed as env keeps it off the logged argv and step header
          MAIL_DOMAIN: ${{ secrets.MAIL_DOMAIN }}
        run: |
          set -euo pipefail
          # Outputs go to outputs.json only; sed drops the "Outputs:" block from the
          # public log (ApiUrl, MxRecord, TableName). pipefail preserves cdk's exit code.
          pnpm exec cdk deploy --require-approval never --no-color \
            -c githubForkOwner=${{ vars.FORGE_GITHUB_FORK_OWNER }} \
            -c publicRepos=${{ vars.PUBLIC_REPOS }} \
            -c autoCapabilities=${{ vars.AUTO_CAPABILITIES }} \
            --outputs-file outputs.json 2>&1 \
            | sed '/^Outputs:$/,/^Stack ARN:$/{/^Stack ARN:$/!d;}'
      - name: Activate SES receipt rule set
        working-directory: infra
        run: |
          RULE_SET=$(jq -r 'to_entries[0].value.ReceiptRuleSetName' outputs.json)
          aws ses set-active-receipt-rule-set --rule-set-name "$RULE_SET"
          echo "Activated receipt rule set: $RULE_SET"
      - name: Write job summary
        # Summaries are world-readable here and NOT covered by ::add-mask:: — never
        # embed ApiUrl/MxRecord/TableName or the domain. Quoted heredoc: no expansion.
        run: |
          cat >> "$GITHUB_STEP_SUMMARY" <<'EOF'
          ## Deployed

          Stack outputs (ApiUrl, MxRecord, TableName) are deliberately not published on this public repo. Read them with: `aws cloudformation describe-stacks --stack-name AgentIdentity --query 'Stacks[0].Outputs'`

          ### Remaining manual steps

          1. Publish the MxRecord output in your DNS provider.
          2. If not already done, verify the SES domain identity and add its DKIM records: `aws sesv2 create-email-identity --email-identity <MAIL_DOMAIN>`
          3. Mint a fleet key: `AGENT_IDENTITY_TABLE=<TableName output> npx tsx packages/admin/src/mailctl.ts fleet-key create --label <label>`
          4. Store the shared GitHub PAT (proxy): a classic token owned by the bot account with `repo` scope (needed to fork + push to private forks) — it should be able to fork sources and write to the bot's OWN forks, never to source repos. `aws ssm put-parameter --name /agent-identity/forge/github/pat --type SecureString --value <PAT>`. Then set the repository variable `FORGE_GITHUB_FORK_OWNER` to the bot account login (Settings > Secrets and variables > Actions > Variables — the name cannot start with GITHUB_) and re-run this deploy — GitHub commits are denied until it is set.
          5. For GitLab provisioning: `aws ssm put-parameter --name /agent-identity/forge/gitlab/admin-token --type SecureString --value <group-owner-token>` and `aws ssm put-parameter --name /agent-identity/forge/gitlab/group --type String --value <top-level-group-id>`
          EOF
